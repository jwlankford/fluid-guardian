services:
  - type: web
    name: fluid-guardian-intake
    runtime: python
    plan: free
    buildCommand: pip install -e ./fg-core -r ./fg-intake-service/requirements.txt
    startCommand: uvicorn main:app --app-dir ./fg-intake-service --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: FG_DATABASE_URL
        sync: false

